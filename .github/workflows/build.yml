name: Monthly NW.js check & build radioApp-lite + Release

on:
  schedule:
    - cron: "0 3 1 * *"   # Запуск 1-го числа каждого месяца в 03:00 UTC
  workflow_dispatch:     # Ручной запуск для тестов

jobs:
  check-and-build:
    runs-on: windows-latest

    steps:
      # Забираем репозиторий целиком (нужен полный граф для git push)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Сравниваем версию NW.js из кэша (.cache/manifest.json) с актуальной на nwjs.io
      # Если новой нет — ставим BUILD_REQUIRED=false, дальше шаги не пойдут
      - name: Compare NW.js versions (cache vs remote)
        id: check-nw-version
        run: |
          $remote = (Invoke-WebRequest -Uri "https://nwjs.io/versions.json" -UseBasicParsing).Content | ConvertFrom-Json
          $cachedPath = ".\.cache\manifest.json"

          if (-not (Test-Path $cachedPath)) {
            echo "BUILD_REQUIRED=true" >> $env:GITHUB_OUTPUT
            echo "NEW_NW_VERSION=$($remote.stable)" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $cached = Get-Content $cachedPath | ConvertFrom-Json
          # Убираем префикс "v" для корректного сравнения (0.118.0 vs 0.117.0)
          $latest = ($remote.stable -replace '^v', '')
          $current = ($cached.nwVersion -replace '^v', '')

          if ($latest -gt $current) {
            Write-Host "New version detected."
            echo "BUILD_REQUIRED=true" >> $env:GITHUB_OUTPUT
            echo "NEW_NW_VERSION=$($remote.stable)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No new stable version. Skip build."
            echo "BUILD_REQUIRED=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      # Чисто лог: если сборка не нужна — пишем, что пропускаем
      - name: Skip if no new version
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'false'
        run: |
          Write-Host "Build skipped: NW.js version unchanged."
        shell: pwsh

      # Ставим Node.js 20 — только если нужна сборка
      - name: Setup Node.js
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Используем твой скрипт установки зависимостей
      - name: Install dependencies
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        run: npm run inst
        shell: pwsh

      # ImageMagick обязателен для твоего скрипта — ставим через Chocolatey
      - name: Install ImageMagick
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        run: choco install imagemagick --no-progress --yes
        shell: pwsh

      # Проверяем, что magick реально доступен
      - name: Verify ImageMagick
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        run: magick --version
        shell: pwsh

      # Читаем версию из package.json (меняется вручную при правках кода)
      - name: Read app version from package.json
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        id: read-app-version
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "APP_VERSION=$($pkg.version)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # Собираем итоговую версию: v<app>.<nw> (например, v4.0.1.0.118.0)
      - name: Compute final version
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        id: compute-final-version
        run: |
          $app = $env:APP_VERSION
          $nw = $env:NEW_NW_VERSION -replace '^v', ''
          $final = "v${app}.${nw}"
          echo "FINAL_VERSION=$final" >> $env:GITHUB_OUTPUT
          Write-Host "Final version: $final"
        shell: pwsh

      # Твой скрипт сборки: обновляет конфиги, data.json, делает exe
      - name: Run build script
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        run: node index.js --version "${{ steps.compute-final-version.outputs.FINAL_VERSION }}"
        shell: pwsh

      # Коммитим все изменившиеся файлы (exe не попадёт — он в .gitignore)
      - name: Commit all changed files
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u
          $status = git status --porcelain
          if ($status) {
            git commit -m "build: radioApp-lite ${{ steps.compute-final-version.outputs.FINAL_VERSION }} (NW.js ${{ steps.check-nw-version.outputs.NEW_NW_VERSION }})"
            git push origin main
          } else {
            Write-Host "No changes to commit."
          }
        shell: pwsh

      # Создаём релиз и прикрепляем exe
      - name: Create GitHub Release and upload exe
        if: steps.check-nw-version.outputs.BUILD_REQUIRED == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.compute-final-version.outputs.FINAL_VERSION }}
          name: "radioApp-lite ${{ steps.compute-final-version.outputs.FINAL_VERSION }}"
          body: |
            Сборка radioApp-lite.
            Версия: ${{ steps.compute-final-version.outputs.FINAL_VERSION }}
            NW.js: ${{ steps.check-nw-version.outputs.NEW_NW_VERSION }}
          files: setup/YourRadioLightSetup.exe
          draft: false
          prerelease: false
