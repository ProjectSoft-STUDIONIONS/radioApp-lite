name: Monthly NW.js check & Build + Release

on:
  schedule:
    # Крон на каждую неделю. По Самаре сработает в Понедельник 00:00
    - cron: "0 20 * * MON"
  # Оставляем ручной запуск
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Fetch remote NW.js version"
        id: fetch-nw-remote
        run: |
          Write-Host "--- STEP: Fetch remote NW.js version ---"
          try {
            $respRaw = (Invoke-WebRequest -Uri "https://nwjs.io/versions.json" -UseBasicParsing).Content
            Write-Host "Raw response length: $($respRaw.Length) chars"
            $resp = $respRaw | ConvertFrom-Json
            Write-Host "Remote stable raw: '$($resp.stable)'"
            $stable = $resp.stable -replace '^v', ''
            Write-Host "Normalized remote stable (no 'v'): '$stable'"
            if ([string]::IsNullOrWhiteSpace($stable)) {
              Write-Host "ERROR: Normalized stable version is empty!"
              exit 1
            }
            echo "NW_STABLE=$stable" >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host "ERROR: Failed to fetch or parse remote versions: $_"
            exit 1
          }
        shell: pwsh

      - name: "Read local manifest.json"
        id: read-local-manifest
        run: |
          Write-Host "--- STEP: Read local manifest ---"
          $path = ".\.cache\manifest.json"
          if (-not (Test-Path $path)) {
            Write-Host "WARNING: .cache\manifest.json not found. Treating as new version."
            echo "LOCAL_NW=0.0.0" >> $env:GITHUB_OUTPUT
          } else {
            $m = Get-Content $path -Raw | ConvertFrom-Json
            $local = $m.stable -replace '^v', ''
            if ([string]::IsNullOrWhiteSpace($local)) {
              Write-Host "ERROR: Local NW version is empty after normalization!"
              exit 1
            }
            echo "LOCAL_NW=$local" >> $env:GITHUB_OUTPUT
            Write-Host "LOCAL_NW=$local"
          }
        shell: pwsh

      - name: "Read package.json"
        id: read-app-version
        run: |
          Write-Host "--- STEP: Read package.json ---"
          $path = ".\package.json"
          if (-not (Test-Path $path)) {
            Write-Host "ERROR: package.json not found!"
            exit 1
          }
          $pkg = Get-Content $path -Raw | ConvertFrom-Json
          $app = $pkg.version.Trim()
          if ([string]::IsNullOrWhiteSpace($app)) {
            Write-Host "ERROR: package.json 'version' field is missing or empty!"
            exit 1
          }
          echo "APP_VERSION=$app" >> $env:GITHUB_OUTPUT
          Write-Host "APP_VERSION=$app"
        shell: pwsh

      - name: "Decide: build or stop"
        id: decide-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "--- STEP: Decide build or stop ---"
          $remote = "${{ steps.fetch-nw-remote.outputs.NW_STABLE }}"
          $local  = "${{ steps.read-local-manifest.outputs.LOCAL_NW }}"
          $app    = "${{ steps.read-app-version.outputs.APP_VERSION }}"
          $event  = "${{ github.event_name }}"

          $tag  = "${app}.${remote}"
          $full = "v${app}.${remote}"

          Write-Host "event='$event' | NW: local='$local' remote='$remote' | app='$app'"
          Write-Host "Candidate tag: '$tag'"

          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --silent 2>$null
          $tagExists = ($LASTEXITCODE -eq 0)

          if ($remote -ne $local) {
            # 1. NW.js изменился — сборка всегда (и крон, и ручной запуск).
            # Единственное исключение: ровно эта пара app+nw уже выпускалась,
            # иначе softprops упадёт на создании дублирующего тега.
            if ($tagExists) {
              Write-Host "NW.js changed, but tag '$tag' already exists. Nothing to release."
              echo "BUILD_REQUIRED=false" >> $env:GITHUB_OUTPUT
              echo "STOP_REASON=nw_changed_but_released" >> $env:GITHUB_OUTPUT
              exit 0
            }
            Write-Host "NW.js changed ($local -> $remote). BUILD REQUIRED."
          }
          elseif (-not $tagExists) {
            # 2. NW.js тот же, но тега для этой версии приложения нет —
            # значит, приложение обновилось (ручной запуск). Собираем.
            Write-Host "App version '$app' has no release with NW.js $remote. BUILD REQUIRED."
          }
          else {
            # 3. Ничего не изменилось — пропуск.
            Write-Host "NW.js unchanged and tag '$tag' exists. Skipping."
            echo "BUILD_REQUIRED=false" >> $env:GITHUB_OUTPUT
            echo "STOP_REASON=nothing_to_build" >> $env:GITHUB_OUTPUT
            exit 0
          }

          echo "BUILD_REQUIRED=true" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tag" >> $env:GITHUB_OUTPUT
          echo "FULL_VERSION=$full" >> $env:GITHUB_OUTPUT
          Write-Host "OUTPUT: BUILD_REQUIRED=true, TAG_NAME=$tag"
        shell: pwsh

      - name: Setup Node.js
        if: steps.decide-build.outputs.BUILD_REQUIRED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install dependencies
        if: steps.decide-build.outputs.BUILD_REQUIRED == 'true'
        run: npm run inst
        shell: pwsh

      - name: Install ImageMagick
        if: steps.decide-build.outputs.BUILD_REQUIRED == 'true'
        run: choco install imagemagick --no-progress --yes
        shell: pwsh

      - name: Verify ImageMagick
        if: steps.decide-build.outputs.BUILD_REQUIRED == 'true'
        run: magick --version
        shell: pwsh

      - name: Run build script
        if: steps.decide-build.outputs.BUILD_REQUIRED == 'true'
        run: node index.js --version "${{ steps.decide-build.outputs.FULL_VERSION }}"
        shell: pwsh

      - name: Commit changed files
        if: steps.decide-build.outputs.BUILD_REQUIRED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u
          $status = git status --porcelain
          if ($status) {
            git commit -m "build: radioApp-lite ${{ steps.decide-build.outputs.FULL_VERSION }} (NW.js ${{ steps.fetch-nw-remote.outputs.NW_STABLE }})"
            git push origin main
          } else {
            Write-Host "No changes to commit."
          }
        shell: pwsh

      - name: Create GitHub Release and upload exe
        if: steps.decide-build.outputs.BUILD_REQUIRED == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.decide-build.outputs.TAG_NAME }}
          name: "radioApp-lite ${{ steps.decide-build.outputs.FULL_VERSION }}"
          body: |
            Сборка radioApp-lite.
            Версия приложения: ${{ steps.read-app-version.outputs.APP_VERSION }}
            NW.js: ${{ steps.fetch-nw-remote.outputs.NW_STABLE }}
            Версия релиза: ${{ steps.decide-build.outputs.FULL_VERSION }}

            ![Скриншот](src/screen/screen0002.jpg)

            [Cписок радиостанций](?tab=readme-ov-file#список-радиостанций)

            [![Downloads YourRadioLightSetup.exe](https://img.shields.io/github/downloads/ProjectSoft-STUDIONIONS/radioApp-lite/${{ steps.decide-build.outputs.TAG_NAME }}/total?style=for-the-badge&label=Downloads%20YourRadioLightSetup.exe&cacheSeconds=10)](../../releases/download/${{ steps.decide-build.outputs.TAG_NAME }}/YourRadioLightSetup.exe)
          files: setup/YourRadioLightSetup.exe
          draft: false
          prerelease: false
